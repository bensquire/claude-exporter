name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: read

concurrency:
    group: release

jobs:
    check:
        uses: ./.github/workflows/ci.yml

    publish:
        needs: check
        runs-on: ubuntu-latest
        environment: chrome-web-store
        permissions:
            contents: write # create the GitHub release
            id-token: write # Workload Identity Federation
        env:
            ZIP: claude-exporter-${{ github.ref_name }}.zip
            ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Check tag matches package.json
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$GITHUB_REF_NAME" != "$version" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version)"
                      exit 1
                  fi

            - run: npm ci
            - run: npm run build
            - name: Package
              run: |
                  zip_path="$RUNNER_TEMP/$ZIP"
                  (cd dist && zip -qrX "$zip_path" .)
                  ls -l "$zip_path"
                  echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"

            - id: auth
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
                  token_format: access_token
                  access_token_scopes: https://www.googleapis.com/auth/chromewebstore

            - name: Upload to Chrome Web Store
              env:
                  TOKEN: ${{ steps.auth.outputs.access_token }}
              run: |
                  api=https://chromewebstore.googleapis.com
                  res=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" \
                      -T "$ZIP_PATH" "$api/upload/v2/$ITEM:upload")
                  echo "$res"
                  state=$(jq -r .uploadState <<<"$res")
                  for _ in $(seq 30); do
                      [ "$state" = IN_PROGRESS ] || break
                      sleep 10
                      state=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
                          "$api/v2/$ITEM:fetchStatus" | jq -r .lastAsyncUploadState)
                  done
                  if [ "$state" != SUCCEEDED ]; then
                      echo "::error::Upload finished in state $state"
                      exit 1
                  fi

            - name: Submit for review
              env:
                  TOKEN: ${{ steps.auth.outputs.access_token }}
              run: |
                  curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" \
                      -H 'Content-Type: application/json' -d '{}' \
                      "https://chromewebstore.googleapis.com/v2/$ITEM:publish"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" "$ZIP_PATH" --verify-tag --generate-notes
